spring:
  application:
    name: task-api

  # carrega as variáveis do arquivo .env (que não vai para o Git), se ele existir
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskdb}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  data:
    web:
      pageable:
        max-page-size: 50

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: task-api
    expiration: ${JWT_EXPIRATION:1h}

management:
  endpoints:
    web:
      exposure:
        include: health
